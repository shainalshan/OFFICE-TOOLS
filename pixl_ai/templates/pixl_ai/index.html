{% extends 'core/base.html' %}

{% block content %}
<style>
    /* Global Overrides for Chat Page */
    .chat-page-container {
        height: calc(100vh - 9rem);
    }

    /* Glass Container */
    .glass-panel {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        border-radius: 24px;
        overflow: hidden;
        height: 100%;
        display: flex;
        flex-direction: column;
    }

    /* Header */
    .chat-header {
        padding: 20px 30px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0, 0, 0, 0.2);
    }

    .chat-title {
        font-size: 1.5rem;
        font-weight: 600;
        background: linear-gradient(90deg, #00f260, #0575d6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    /* Chat Area */
    .chat-area {
        flex: 1;
        overflow-y: auto;
        padding: 30px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        scroll-behavior: smooth;
    }

    /* Custom Scrollbar for Chat Area */
    .chat-area::-webkit-scrollbar {
        width: 6px;
    }

    .chat-area::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.02);
    }

    .chat-area::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
    }

    /* Bubbles */
    .message-row {
        display: flex;
        width: 100%;
    }

    .message-row.user {
        justify-content: flex-end;
    }

    .bubble {
        max-width: 70%;
        padding: 15px 25px;
        border-radius: 20px;
        font-size: 1rem;
        line-height: 1.5;
        position: relative;
        color: #fff;
    }

    .bubble.user {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-bottom-right-radius: 5px;
        box-shadow: 0 5px 15px rgba(118, 75, 162, 0.3);
    }

    .bubble.ai {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-bottom-left-radius: 5px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .bubble.ai::before {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: 20px;
        padding: 1px;
        background: linear-gradient(45deg, #00f260, #0575e6);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        opacity: 0.5;
        pointer-events: none;
        border-bottom-left-radius: 5px;
    }

    /* Input Area */
    .input-area {
        padding: 20px 30px;
        background: rgba(0, 0, 0, 0.2);
        display: flex;
        gap: 15px;
        align-items: center;
    }

    .glass-input {
        flex: 1;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        padding: 15px 20px;
        border-radius: 50px;
        outline: none;
        transition: all 0.3s ease;
    }

    .glass-input:focus {
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 0 15px rgba(5, 117, 214, 0.3);
        border-color: rgba(5, 117, 214, 0.5);
    }

    .send-btn {
        background: linear-gradient(90deg, #00f260, #0575e6);
        border: none;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 0 20px rgba(0, 242, 96, 0.4);
        transition: transform 0.2s;
    }

    .send-btn:hover {
        transform: scale(1.1);
    }

    .send-btn svg {
        fill: white;
        width: 24px;
        height: 24px;
    }

    /* Tesseract Animation */
    .tesseract-wrapper {
        width: 40px;
        height: 40px;
        perspective: 100px;
        margin-right: 15px;
    }

    .cube {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        animation: rotate 2s infinite linear;
    }

    .cube div {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 2px solid #00f260;
        opacity: 0.8;
        box-sizing: border-box;
    }

    .front {
        transform: translateZ(20px);
    }

    .back {
        transform: rotateY(180deg) translateZ(20px);
    }

    .right {
        transform: rotateY(90deg) translateZ(20px);
    }

    .left {
        transform: rotateY(-90deg) translateZ(20px);
    }

    .top {
        transform: rotateX(90deg) translateZ(20px);
    }

    .bottom {
        transform: rotateX(-90deg) translateZ(20px);
    }

    .inner-cube {
        width: 50%;
        height: 50%;
        position: absolute;
        top: 25%;
        left: 25%;
        transform-style: preserve-3d;
        animation: rotate-reverse 2s infinite linear;
    }

    .inner-cube div {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 1px solid #0575e6;
        opacity: 0.9;
        box-sizing: border-box;
        background: rgba(5, 117, 230, 0.1);
    }

    @keyframes rotate {
        from {
            transform: rotateX(0deg) rotateY(0deg);
        }

        to {
            transform: rotateX(360deg) rotateY(360deg);
        }
    }

    @keyframes rotate-reverse {
        from {
            transform: rotateX(360deg) rotateY(360deg);
        }

        to {
            transform: rotateX(0deg) rotateY(0deg);
        }
    }

    .loading-container {
        display: flex;
        align-items: center;
        color: #00f260;
        font-style: italic;
        margin-top: 10px;
        margin-left: 10px;
    }

    .action-group .btn-glass {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        padding: 5px 15px;
        border-radius: 12px;
        margin-left: 10px;
        cursor: pointer;
    }
</style>

<div class="chat-page-container">
    <div class="glass-panel">
        <!-- Header -->
        <div class="chat-header">
            <div class="chat-title">
                <span style="font-size:2rem;">🧬</span> Pixl AI
            </div>
            <div class="action-group">
                <button onclick="startNewChat()" class="btn-glass">📝 New Chat</button>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area" id="chat-box">
            <div class="text-center mt-5" style="opacity: 0.6;">
                <h3>How can I enable you today?</h3>
                <p>Ask about inventory, staff, or just chat.</p>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <form id="chat-form" style="display:flex; gap:15px; width:100%;">
                <input type="text" id="user-input" class="glass-input" placeholder="Type your message..." required
                    autocomplete="off">
                <button type="submit" class="send-btn">
                    <svg viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                    </svg>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');

    function createTesseract() {
        return `
        <div class="loading-container" id="loader-tesseract">
            <div class="tesseract-wrapper">
                <div class="cube">
                    <div class="front"></div>
                    <div class="back"></div>
                    <div class="right"></div>
                    <div class="left"></div>
                    <div class="top"></div>
                    <div class="bottom"></div>
                    <div class="inner-cube">
                        <div class="front"></div>
                        <div class="back"></div>
                        <div class="right"></div>
                        <div class="left"></div>
                        <div class="top"></div>
                        <div class="bottom"></div>
                    </div>
                </div>
            </div>
            <span>Thinking...</span>
        </div>`;
    }

    function appendMessage(sender, text, isUser, msgId = null, isHtml = false) {
        if (chatBox.querySelector('.text-center')) {
            chatBox.innerHTML = '';
        }

        const msgDiv = document.createElement('div');
        msgDiv.className = `message-row ${isUser ? 'user' : 'ai'}`;

        const contentWrapper = document.createElement('div');
        contentWrapper.style.display = 'flex';
        contentWrapper.style.flexDirection = 'column';
        contentWrapper.style.alignItems = isUser ? 'flex-end' : 'flex-start';
        contentWrapper.style.maxWidth = '75%';

        if (isHtml) {
            msgDiv.innerHTML = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return;
        } else {
            const bubble = document.createElement('div');
            bubble.className = `bubble ${isUser ? 'user' : 'ai'}`;
            bubble.innerText = text;
            contentWrapper.appendChild(bubble);
        }

        msgDiv.appendChild(contentWrapper);
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function startNewChat() {
        if (confirm("Start a new chat?")) {
            chatBox.innerHTML = `
                <div class="text-center mt-5" style="opacity: 0.6;">
                    <h3>How can I enable you today?</h3>
                    <p>Ask about inventory, staff, or just chat.</p>
                </div>
             `;
        }
    }

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const query = userInput.value.trim();
        if (!query) return;

        appendMessage('You', query, true);
        userInput.value = '';

        const loadingId = 'loading-' + Date.now();
        const tesseractHtml = createTesseract();

        // Append raw HTML for tesseract
        const loaderDiv = document.createElement('div');
        loaderDiv.id = loadingId;
        loaderDiv.innerHTML = tesseractHtml;
        chatBox.appendChild(loaderDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch('{% url "pixl_ai_chat" %}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({ question: query })
            });

            const data = await response.json();

            const loader = document.getElementById(loadingId);
            if (loader) loader.remove();

            if (data.answer) {
                appendMessage('AI', data.answer, false);
            } else {
                appendMessage('System', "Error: " + (data.error || "Unknown error"), false);
            }
        } catch (error) {
            const loader = document.getElementById(loadingId);
            if (loader) loader.remove();
            appendMessage('System', "Network Error", false);
        }
    });
</script>
{% endblock %}
