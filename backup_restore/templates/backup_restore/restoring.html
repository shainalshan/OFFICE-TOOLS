{% extends 'core/base.html' %}
{% block title %}Restoring System...{% endblock %}

{% block content %}
<div
    style="margin-top: 2rem; width: 200px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden;">
    <div style="height: 100%; width: 50%; background: #6366f1; animation: loading 1.5s infinite linear;"></div>
</div>

<script>
    // Check if server is back up every 5 seconds
    setInterval(() => {
        fetch('/')
            .then(response => {
                if (response.ok) {
                    window.location.href = '{% url "login" %}';
                }
            })
            .catch(e => console.log('Waiting for server...'));
    }, 5000);

    const style = document.createElement('style');
    style.innerHTML = `
            @keyframes loading {
                0% { transform: translateX(-100%); }
                100% { transform: translateX(200%); }
            }
        `;
    document.head.appendChild(style);
</script>
</div>
{% endblock %}
