{% extends 'core/base_modern.html' %}

{% block content %}
<style>
    /* Global Overrides for Chat Page */
    /* Scoped to this container instead of body */
    .chat-page-container {
        /* background: radial-gradient(circle at 10% 20%, rgb(0, 0, 0) 0%, rgb(30, 30, 40) 90.2%); */
        /* font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; */
        /* Using base font and background, but we can add specific chat-theme overrides here if needed */
        height: calc(100vh - 9rem);
        /* Fit within the viewport minus header/padding */
    }

    /* Glass Container */
    .glass-panel {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        border-radius: 24px;
        overflow: hidden;
        height: 100%;
        /* Fill the container */
        display: flex;
        flex-direction: column;
    }

    /* Header */
    .chat-header {
        padding: 20px 30px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0, 0, 0, 0.2);
    }

    .chat-title {
        font-size: 1.5rem;
        font-weight: 600;
        background: linear-gradient(90deg, #00f260, #0575d6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    /* Chat Area */
    .chat-area {
        flex: 1;
        overflow-y: auto;
        padding: 30px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        scroll-behavior: smooth;
    }

    /* Custom Scrollbar for Chat Area */
    .chat-area::-webkit-scrollbar {
        width: 6px;
    }

    .chat-area::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.02);
    }

    .chat-area::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
    }

    /* Bubbles */
    .message-row {
        display: flex;
        width: 100%;
    }

    .message-row.user {
        justify-content: flex-end;
    }

    .bubble {
        max-width: 70%;
        padding: 15px 25px;
        border-radius: 20px;
        font-size: 1rem;
        line-height: 1.5;
        position: relative;
        color: #fff;
    }

    .bubble.user {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-bottom-right-radius: 5px;
        box-shadow: 0 5px 15px rgba(118, 75, 162, 0.3);
    }

    .bubble.ai {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-bottom-left-radius: 5px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .bubble.ai::before {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: 20px;
        padding: 1px;
        background: linear-gradient(45deg, #00f260, #0575e6);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        opacity: 0.5;
        pointer-events: none;
        border-bottom-left-radius: 5px;
    }

    /* Input Area */
    .input-area {
        padding: 20px 30px;
        background: rgba(0, 0, 0, 0.2);
        display: flex;
        gap: 15px;
        align-items: center;
    }

    .glass-input {
        flex: 1;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        padding: 15px 20px;
        border-radius: 50px;
        outline: none;
        transition: all 0.3s ease;
    }

    .glass-input:focus {
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 0 15px rgba(5, 117, 214, 0.3);
        border-color: rgba(5, 117, 214, 0.5);
    }

    .send-btn {
        background: linear-gradient(90deg, #00f260, #0575e6);
        border: none;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 0 20px rgba(0, 242, 96, 0.4);
        transition: transform 0.2s;
    }

    .send-btn:hover {
        transform: scale(1.1);
    }

    .send-btn svg {
        fill: white;
        width: 24px;
        height: 24px;
    }

    /* Tesseract Animation (CSS 3D) */
    .tesseract-wrapper {
        width: 40px;
        height: 40px;
        perspective: 100px;
        margin-right: 15px;
    }

    .cube {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        animation: rotate 2s infinite linear;
    }

    .cube div {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 2px solid #00f260;
        opacity: 0.8;
        box-sizing: border-box;
    }

    .front {
        transform: translateZ(20px);
    }

    .back {
        transform: rotateY(180deg) translateZ(20px);
    }

    .right {
        transform: rotateY(90deg) translateZ(20px);
    }

    .left {
        transform: rotateY(-90deg) translateZ(20px);
    }

    .top {
        transform: rotateX(90deg) translateZ(20px);
    }

    .bottom {
        transform: rotateX(-90deg) translateZ(20px);
    }

    .inner-cube {
        width: 50%;
        height: 50%;
        position: absolute;
        top: 25%;
        left: 25%;
        transform-style: preserve-3d;
        animation: rotate-reverse 2s infinite linear;
    }

    .inner-cube div {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 1px solid #0575e6;
        opacity: 0.9;
        box-sizing: border-box;
        background: rgba(5, 117, 230, 0.1);
    }

    @keyframes rotate {
        from {
            transform: rotateX(0deg) rotateY(0deg);
        }

        to {
            transform: rotateX(360deg) rotateY(360deg);
        }
    }

    @keyframes rotate-reverse {
        from {
            transform: rotateX(360deg) rotateY(360deg);
        }

        to {
            transform: rotateX(0deg) rotateY(0deg);
        }
    }

    .loading-container {
        display: flex;
        align-items: center;
        color: #00f260;
        font-style: italic;
        margin-top: 10px;
        margin-left: 10px;
    }

    /* Action Buttons (Top Right) */
    .action-group .btn-glass {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        margin-left: 10px;
        transition: all 0.3s;
    }

    .action-group .btn-glass:hover {
        background: rgba(255, 255, 255, 0.2);
        border-color: #00f260;
        box-shadow: 0 0 10px rgba(0, 242, 96, 0.2);
        color: white;
    }

    /* Feedback Actions */
    .feedback-actions {
        display: flex;
        gap: 8px;
        margin-top: 5px;
        opacity: 0;
        transition: opacity 0.3s;
        justify-content: flex-start;
    }

    .message-row:hover .feedback-actions {
        opacity: 1;
    }

    .feedback-btn {
        background: none;
        border: none;
        cursor: pointer;
        opacity: 0.5;
        transition: all 0.2s;
        padding: 0;
        width: 20px;
        height: 20px;
    }

    .feedback-btn:hover {
        opacity: 1;
        transform: scale(1.2);
    }

    .feedback-btn.active {
        opacity: 1;
        color: #00f260;
    }

    .feedback-btn svg {
        width: 16px;
        height: 16px;
        fill: #aaa;
    }

    .feedback-btn:hover svg {
        fill: white;
    }

    .mode-toggles input[type="radio"] {
        accent-color: #00ddeb;
    }
</style>

<!-- Main Container to replace container class and fix positioning -->
<div class="chat-page-container">
    <div class="glass-panel">
        <!-- Header -->
        <div class="chat-header">
            <div class="chat-title">
                <span style="font-size:2rem;">🧬</span> Pixl AI
            </div>
            <div class="action-group">
                <button onclick="startNewChat()" class="btn btn-sm btn-glass">📝 New Chat</button>
                {% if user.is_superuser %}
                <button onclick="restartEngine()" class="btn btn-sm btn-glass">⚡ Restart AI</button>
                <a href="{% url 'knowledge_list' %}" class="btn btn-sm btn-glass">Manage Memory</a>
                {% else %}
                <!-- <a href="{% url 'home' %}" class="btn btn-sm btn-glass">Exit</a> -->
                {% endif %}
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area" id="chat-box">
            <div class="text-center mt-5" style="opacity: 0.6;">
                <h3>How can I enable you today?</h3>
                <p>Ask about inventory, staff, or just chat.</p>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area" style="flex-direction: column; align-items: stretch;">
            <!-- Mode Toggles -->

            <form id="chat-form" style="display:flex; gap:15px; width:100%;">
                <input type="text" id="user-input" class="glass-input" placeholder="Type your message..." required
                    autocomplete="off">
                <button type="submit" class="send-btn">
                    <svg viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                    </svg>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');

    function createTesseract() {
        // Returns the HTML string for the tesseract spinner
        return `
        <div class="loading-container" id="loader-tesseract">
            <div class="tesseract-wrapper">
                <div class="cube">
                    <div class="front"></div>
                    <div class="back"></div>
                    <div class="right"></div>
                    <div class="left"></div>
                    <div class="top"></div>
                    <div class="bottom"></div>
                    <div class="inner-cube">
                        <div class="front"></div>
                        <div class="back"></div>
                        <div class="right"></div>
                        <div class="left"></div>
                        <div class="top"></div>
                        <div class="bottom"></div>
                    </div>
                </div>
            </div>
            <span>Thinking...</span>
        </div>`;
    }

    let lastUserQuery = "";

    function appendMessage(sender, text, isUser, msgId = null, isHtml = false) {
        // Clear initial message if present
        if (chatBox.querySelector('.text-center')) {
            chatBox.innerHTML = '';
        }

        const msgDiv = document.createElement('div');
        msgDiv.className = `message-row ${isUser ? 'user' : 'ai'}`;
        if (msgId) msgDiv.id = msgId;

        const contentWrapper = document.createElement('div');
        contentWrapper.style.display = 'flex';
        contentWrapper.style.flexDirection = 'column';
        contentWrapper.style.alignItems = isUser ? 'flex-end' : 'flex-start';
        contentWrapper.style.maxWidth = '75%';

        // Bubble
        if (isHtml) {
            msgDiv.innerHTML = text; // Only for pure HTML loaders
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return;
        } else {
            const bubble = document.createElement('div');
            bubble.className = `bubble ${isUser ? 'user' : 'ai'}`;
            bubble.style.maxWidth = '100%'; // Wrapper controls width
            bubble.innerText = text;
            contentWrapper.appendChild(bubble);
        }

        // Feedback Buttons (Only for AI)
        if (!isUser && text !== 'Thinking...') {
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'feedback-actions';

            actionsDiv.innerHTML = `
                <button onclick="sendFeedback(this, 1, '${sender}', \`${text.replace(/`/g, "")}\`)" class="feedback-btn" title="Helpful">
                    <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-1.91l-.01-.01L23 10z"/></svg>
                </button>
                <button onclick="sendFeedback(this, -1, '${sender}', \`${text.replace(/`/g, "")}\`)" class="feedback-btn" title="Not Helpful">
                    <svg viewBox="0 0 24 24"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v1.91l.01-.01L1 14c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.36-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"/></svg>
                </button>
            `;
            contentWrapper.appendChild(actionsDiv);

            actionsDiv.setAttribute('data-query', lastUserQuery);
        }

        msgDiv.appendChild(contentWrapper);
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendFeedback(btn, rating, sender, responseText) {
        // UI Update
        const parent = btn.parentElement;
        const query = parent.getAttribute('data-query');

        // Visual Feedback
        parent.innerHTML = `<span style="color:#00f260; font-size:0.8rem;">Thanks for feedback!</span>`;

        // Send to Server
        try {
            await fetch("{% url 'submit_ai_feedback' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({
                    query: query,
                    response: responseText,
                    rating: rating
                })
            });
        } catch (e) { console.error(e); }
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const query = userInput.value.trim();
        if (!query) return;

        lastUserQuery = query; // Save for feedback linking

        // User Message
        appendMessage('You', query, true);
        userInput.value = '';

        // Tesseract Loading Indicator
        const loadingId = 'loading-' + Date.now();
        appendMessage('System', createTesseract(), false, loadingId, true);

        // Disable input
        userInput.disabled = true;

        // Build Context Payload
        const payload = {
            message: query,
            mode: 'think' // Always force think mode
        };

        // API Call
        try {
            const response = await fetch(`{% url 'ask_ai' %}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify(payload)
            });
            const data = await response.json();

            // Remove Loading Indicator
            const loadingMsg = document.getElementById(loadingId);
            if (loadingMsg) loadingMsg.remove();

            if (data.answer) {
                appendMessage('AI', data.answer, false);
            } else if (data.error) {
                appendMessage('System', `Error: ${data.error}`, false);
            }
        } catch (error) {
            const loadingMsg = document.getElementById(loadingId);
            if (loadingMsg) loadingMsg.remove();
            appendMessage('System', 'Error connecting to AI service.', false);
        } finally {
            // Re-enable input
            userInput.disabled = false;
            userInput.focus();
        }
    });

    function restartEngine() {
        if (!confirm("Are you sure you want to restart the AI Engine?")) return;

        fetch("{% url 'restart_ai_engine' %}")
            .then(response => response.json())
            .then(data => {
                alert(data.status || data.error);
                appendMessage('System', 'Restart command initiated. Please wait...', false);
            })
            .catch(error => alert('Error: ' + error));
    }

    function startNewChat() {
        if (confirm("Start a new chat?")) {
            chatBox.innerHTML = `
                <div class="text-center mt-5" style="opacity: 0.6;">
                    <h3>How can I enable you today?</h3>
                    <p>Ask about inventory, staff, or just chat.</p>
                </div>
             `;
        }
    }
</script>
{% endblock %}
