{% extends 'core/base.html' %}
{% load static %}

{% block content %}
<div class="form-container glass-container animate-fade-in" style="max-width: 400px; margin: 4rem auto;">
    <h2 style="text-align: center; margin-bottom: 1rem; color: #e2e8f0;">Forgot Password</h2>
    <p style="text-align: center; color: #94a3b8; margin-bottom: 2rem; font-size: 0.9rem;">
        Enter your registered email address or username. <br>We'll email you a temporary password.
    </p>

    <form method="post">
        {% csrf_token %}

        <div class="form-group" style="margin-bottom: 1.5rem;">
            <label style="display: block; margin-bottom: 0.5rem; color: #cbd5e1;">Email or Username</label>
            <input type="text" name="identifier" class="glass-input" required placeholder="john@example.com"
                style="width: 100%; padding: 0.8rem; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white;">
        </div>

        <button type="submit" class="glass-button"
            style="width: 100%; padding: 0.8rem; background: #6366f1; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: 500;">
            Reset Password
        </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem;">
        <a href="{% url 'login' %}" style="color: #94a3b8; text-decoration: none; font-size: 0.9rem;">Back to Login</a>
    </div>
</div>
{% endblock %}
