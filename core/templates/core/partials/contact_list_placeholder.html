<div class="overflow-x-auto">
    <table style="width: 100%; border-collapse: collapse; color: #e2e8f0;">
        <thead>
            <tr style="border-bottom: 1px solid #334155; text-align: left;">
                <th style="padding: 0.75rem;">Name</th>
                <th style="padding: 0.75rem;">Designation</th>
                <th style="padding: 0.75rem;">Email</th>
                <th style="padding: 0.75rem;">Phone</th>
                <th style="padding: 0.75rem; text-align: right;">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for contact in contacts %}
            <tr style="border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.2s;">
                <td style="padding: 0.75rem;">{{ contact.name }}</td>
                <td style="padding: 0.75rem;">{{ contact.designation }}</td>
                <td style="padding: 0.75rem;">{{ contact.email }}</td>
                <td style="padding: 0.75rem;">{{ contact.phone_number }}</td>
                <td style="padding: 0.75rem; text-align: right;">
                    <form method="POST" action="{% url 'admin_dashboard' %}" style="display: inline;"
                        onsubmit="return confirm('Are you sure?');">
                        {% csrf_token %}
                        <input type="hidden" name="action" value="delete_contact">
                        <input type="hidden" name="contact_id" value="{{ contact.id }}">
                        <button type="submit"
                            style="color: #ef4444; background: none; border: none; cursor: pointer;">Delete</button>
                    </form>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" style="padding: 1rem; text-align: center; color: #94a3b8;">No contacts found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
