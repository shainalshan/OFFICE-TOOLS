<div class="glass-container notification-card-btn" data-event-type="{{ setting.event_type }}"
    data-event-title="{{ setting.get_event_type_display }}"
    data-subscribers='[{% for sub in setting.subscribers.all %}{"id":"{{ sub.id }}", "username":"{{ sub.username|escapejs }}"}{% if not forloop.last %},{% endif %}{% endfor %}]'
    onclick="openSubscriberModal(this)"
    style="padding: 1.5rem; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 120px;">

    <h3 style="margin: 0; color: #e2e8f0; font-size: 1.1rem; margin-bottom: 0.5rem;">
        {{ setting.get_event_type_display }}
    </h3>

    <div style="color: var(--text-secondary); font-size: 0.9rem;">
        {% with count=setting.subscribers.count %}
        {% if count == 0 %}
        <span style="opacity: 0.7;">No subscribers</span>
        {% else %}
        <span style="color: #818cf8; font-weight: bold;">{{ count }} subscriber{{ count|pluralize }}</span>
        {% endif %}
        {% endwith %}
    </div>

    <div
        style="margin-top: 1rem; color: #6366f1; font-size: 0.8rem; border: 1px solid #6366f1; padding: 0.3rem 0.8rem; border-radius: 20px;">
        Manage
    </div>
</div>
