{% extends 'core/base.html' %}

{% block content %}
<div class="form-container glass-container animate-fade-in">
    <div style="text-align: center; margin-bottom: 2rem;">
        <h2 style="margin:0;">Create Ticket</h2>
        <p style="color: var(--text-secondary); margin-top: 0.5rem;">Report an issue to the IT team.</p>
    </div>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label for="id_priority">Priority</label>
            <div style="background: rgba(0,0,0,0.2); padding: 0.5rem; border-radius: 8px;">
                {{ form.priority }}
            </div>
            <div class="file-hint" style="margin-top: 0.5rem;">
                <span class="dot-P1">● P1 Critical (Red)</span>
                <span class="dot-P2">● P2 High (Orange)</span>
                <span class="dot-P3">● P3 Medium (Yellow)</span>
                <span class="dot-P4">● P4 Low (Green)</span>
            </div>
        </div>

        <div class="form-group">
            <label for="id_issue">Issue Description</label>
            {{ form.issue }}
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="submit" class="btn-primary" style="margin-top: 0;">Submit Ticket</button>
            <a href="{% url 'my_tickets' %}"
                style="display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--text-secondary); padding: 0 1rem;">Cancel</a>
        </div>
    </form>
</div>

<style>
    select,
    textarea {
        width: 100%;
        padding: 0.75rem;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid var(--glass-border);
        color: white;
        font-family: inherit;
        font-size: 1rem;
    }
</style>
{% endblock %}
