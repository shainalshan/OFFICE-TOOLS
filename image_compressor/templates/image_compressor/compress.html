{% extends 'core/base.html' %}

{% block content %}
<div class="animate-fade-in">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <div>
            <a href="{% url 'admin_dashboard' %}"
                style="text-decoration: none; color: var(--text-secondary); margin-right: 1rem;">← Dashboard</a>
            <h1 style="display: inline; margin: 0;">Image Compressor</h1>
        </div>
    </div>

    <div class="glass-container" style="max-width: 600px; margin: 0 auto; text-align: center; padding: 3rem;">

        {% if error %}
        <div
            style="background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; padding: 1rem; border-radius: 8px; margin-bottom: 2rem;">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" enctype="multipart/form-data" id="compress-form">
            {% csrf_token %}

            <div id="drop-zone"
                style="border: 2px dashed rgba(255,255,255,0.2); border-radius: 12px; padding: 3rem; cursor: pointer; transition: all 0.3s;"
                onclick="document.getElementById('file-input').click()">

                <div style="font-size: 4rem; margin-bottom: 1rem;">🖼️</div>
                <h3 style="margin-bottom: 0.5rem; color: #e2e8f0;">Click or Drag Image Here</h3>
                <p style="color: var(--text-secondary); margin-bottom: 0;">Max size: 5MB. Target: 30-50KB.</p>
                <div id="file-name" style="margin-top: 1rem; color: #60a5fa; font-weight: bold;"></div>
            </div>

            <input type="file" name="image" id="file-input" accept="image/*" style="display: none;"
                onchange="handleFileSelect(this)">

            <button type="submit" id="submit-btn" class="btn-primary"
                style="margin-top: 2rem; width: 100%; display: none;">
                Compress & Download ⬇️
            </button>
        </form>
    </div>
</div>

<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const submitBtn = document.getElementById('submit-btn');

    // Drag & Drop visual feedback
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#6366f1';
        dropZone.style.background = 'rgba(99, 102, 241, 0.1)';
    });

    dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = 'rgba(255,255,255,0.2)';
        dropZone.style.background = 'transparent';
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = 'rgba(255,255,255,0.2)';
        dropZone.style.background = 'transparent';

        if (e.dataTransfer.files.length) {
            fileInput.files = e.dataTransfer.files;
            handleFileSelect(fileInput);
        }
    });

    function handleFileSelect(input) {
        if (input.files && input.files[0]) {
            const file = input.files[0];
            document.getElementById('file-name').innerText = "Selected: " + file.name;
            submitBtn.style.display = 'block';

            // Optional: Auto submit if user desires, but button is safer
            // document.getElementById('compress-form').submit();
        }
    }
</script>
{% endblock %}
