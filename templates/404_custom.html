{% extends 'core/base.html' %}

{% block content %}
<div class="glass-container" style="max-width: 600px; margin: 4rem auto; text-align: center; padding: 3rem;">
    <div style="font-size: 4rem; margin-bottom: 1rem;">🔍</div>
    <h1 style="margin-bottom: 1rem;">Page Not Found</h1>

    <p style="color: var(--text-secondary); font-size: 1.1rem; margin-bottom: 2rem;">
        {{ message|default:"The page you are looking for doesn't exist or has been moved." }}
    </p>

    <a href="{% url 'home' %}" class="btn-primary" style="width: auto;">Return to Dashboard</a>
</div>
{% endblock %}
